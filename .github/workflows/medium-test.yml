name: Medium Test
on:
  workflow_call:
    inputs:
      model:
        required: false
        type: string
        default: 'gpt-4o-mini'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    if: github.event.sender.type != 'Bot'
    concurrency:
      group: test-${{ github.repository }}-${{ github.event.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - run: echo "model=${{ inputs.model }}"
