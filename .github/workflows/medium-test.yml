name: Medium Test
on:
  workflow_call:
    inputs:
      model:
        required: false
        type: string
        default: 'gpt-4o-mini'
jobs:
  run:
    runs-on: ubuntu-latest
    if: "!github.event.pull_request || github.event.pull_request.user.type != 'Bot'"
    steps:
      - run: echo "model=${{ inputs.model }}"
